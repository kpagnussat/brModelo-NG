[versions]
commonmark = "0.24.0"
junit = "6.1.3"
flatlaf = "3.7.2"
# This is the version declared by FlatLaf Extras 3.7.2.
jsvg = "2.1.0"
dbus = "5.2.2"
slf4j = "2.0.17"

[libraries]
commonmark = { module = "org.commonmark:commonmark", version.ref = "commonmark" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
flatlaf = { module = "com.formdev:flatlaf", version.ref = "flatlaf" }
flatlaf-extras = { module = "com.formdev:flatlaf-extras", version.ref = "flatlaf" }
flatlaf-intellij-themes = { module = "com.formdev:flatlaf-intellij-themes", version.ref = "flatlaf" }
jsvg = { module = "com.github.weisj:jsvg", version.ref = "jsvg" }

dbus-core = { module = "com.github.hypfvieh:dbus-java-core", version.ref = "dbus" }
dbus-unixsocket = { module = "com.github.hypfvieh:dbus-java-transport-native-unixsocket", version.ref = "dbus" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
